# Fly.io: one machine, SQLite and day copies on the ttl_data volume.
# First deploy:
#   fly apps create throughthelense        # or pick another name and replace it below
#   fly volumes create ttl_data --size 1 --region fra
#   fly deploy
# Keep a single machine: SQLite lives on one volume (fly scale count 1).
app = "throughthelense"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  [build.args]
    SITE_ORIGIN = "https://throughthelense.fly.dev"

[env]
  PUBLIC_BASE_URL = "https://throughthelense.fly.dev"
  TRUST_PROXY = "1"
  PORT = "8080"
  DATA_DIR = "/data"
  # Each save holds up to 76 MiB in memory; one at a time fits 512 MB.
  MAX_CONCURRENT_UPLOADS = "1"

[[mounts]]
  source = "ttl_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/robots.txt"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
