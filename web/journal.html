<!doctype html>
<html lang="ru" data-type="software">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f4eb">
  <meta name="site-kind" content="software">
  <meta name="page-type" content="software">
  <meta name="description" content="Личный фотодневник. Сохраните атмосферу дня в фотографиях, собственных словах и музыке.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/styles.css?v=6">
  <link rel="stylesheet" href="/player.css">
  <link rel="stylesheet" href="/consent.css">
  <script type="module" src="/consent.mjs"></script>
  <meta name="robots" content="noindex">
  <title>ThroughTheLense — Архив дней</title>
</head>
<body>
  <a class="skip" href="#main">К содержанию</a>
  <header class="mast"><div class="wrap mast-inner">
    <a class="brand" href="/" aria-label="ThroughTheLense, главная"><img src="brand-mark.svg" alt="" width="33" height="33"><span>ThroughThe<em>Lense</em></span></a>
    <nav aria-label="Основная навигация"><a id="nav-archive" href="#archive">Архив</a><button type="button" id="about-trigger">О проекте</button></nav>
    <a class="btn primary create-link" href="#new"><span aria-hidden="true" class="plus">+</span> Записать день</a>
    <a class="journal-account" href="/account.html" id="journal-account" aria-label="Войти в аккаунт" title="Аккаунт">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3"/><path d="M5 20v-1a7 7 0 0 1 14 0v1" stroke-linecap="round"/></svg>
    </a>
  </div></header>
  <main class="wrap" id="main" tabindex="-1">
    <p class="loading-state" role="status">Открываем дневник…</p>
  </main>
  <footer class="wrap foot"><span>ThroughTheLense</span><small id="storage-note">Гостевые дни хранятся в этом браузере</small><nav aria-label="Ссылки в подвале"><a href="/privacy.html">Конфиденциальность</a><a href="/terms.html">Условия</a><button type="button" data-consent-settings hidden>Настройки аналитики</button></nav></footer>
  <div id="status" class="toast" role="status"></div>
  <dialog id="dialog"><div id="dialog-body"></div><button class="round close-dialog" id="dialog-close" type="button" aria-label="Закрыть">×</button></dialog>
  <noscript>Для фотодневника включите JavaScript в настройках браузера.</noscript>
  <script type="module">
    import('./app.mjs?v=6').catch(error => {
      console.error('ThroughTheLense: ошибка запуска', error);
      document.querySelector('#main').innerHTML =
        '<section class="empty startup-error" role="alert"><h1>Дневник не загрузился</h1>' +
        '<p>Обновите страницу, чтобы повторить загрузку.</p>' +
        '<button class="btn primary" type="button">Обновить страницу</button></section>';
      document.querySelector('.startup-error button').onclick = () => location.reload();
    });
  </script>
</body></html>
