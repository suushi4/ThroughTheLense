<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f4eb">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="description" content="Войдите в ThroughTheLense, чтобы сохранить дневник в аккаунте.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/home.css">
  <link rel="stylesheet" href="/account.css">
  <link rel="stylesheet" href="/consent.css">
  <script type="module" src="/consent.mjs"></script>
  <title>Аккаунт · ThroughTheLense</title>
  <script type="module" src="/account-page.mjs"></script>
</head>
<body>
  <a class="skip" href="#account-content">К содержанию</a>
  <main class="account-page" id="account-content" tabindex="-1">
    <div class="account-image" aria-hidden="true"></div>
    <div class="account-panel">
      <a class="wordmark" href="/" translate="no"><img alt="" src="/brand-mark.svg" width="36" height="36"><span>ThroughThe<em>Lense</em></span></a>
      <section class="account-content" aria-labelledby="account-heading">
        <h1 id="account-heading" tabindex="-1">Войти в дневник</h1>
        <p id="account-intro">Ваши дни доступны в вашем аккаунте.</p>
        <form id="credentials" hidden>
          <label for="email">Электронная почта</label>
          <input type="email" id="email" name="email" autocomplete="email" spellcheck="false" required maxlength="254">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required maxlength="128">
          <p id="password-hint" class="account-hint" hidden>Не менее 8 символов</p>
          <button class="action solid" id="auth-submit" type="submit">Войти</button>
          <button class="auth-switch" type="button" id="auth-mode">Создать аккаунт</button>
        </form>
        <div id="signed-in" hidden>
          <p class="account-email"></p>
          <a class="action solid" href="/journal.html#archive">Мой архив</a>
          <button class="auth-switch" id="sign-out" type="button">Выйти из аккаунта</button>
        </div>
        <p id="auth-status" class="auth-status" role="status">Открываем аккаунт…</p>
        <button class="action account-retry" id="auth-retry" type="button" hidden>Повторить загрузку</button>
        <a class="guest-link" href="/journal.html#archive">Продолжить без аккаунта</a>
      </section>
      <footer class="account-links">
        <nav aria-label="Ссылки в подвале"><a href="/privacy.html">Конфиденциальность</a><a href="/terms.html">Условия</a></nav>
      </footer>
    </div>
  </main>
</body>
</html>
