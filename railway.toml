# Railway: build the Dockerfile, keep SQLite and day copies on a volume at /data.
# One replica only: SQLite lives on that single volume.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/runtime"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
